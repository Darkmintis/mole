name: mole
description: >-
  Local storage inspector for Flutter - see, edit, and clear everything your
  app has stored in SharedPreferences, Hive, Secure Storage, and caches.
version: 0.1.2
homepage: https://github.com/darkmintis/mole
repository: https://github.com/darkmintis/mole
issue_tracker: https://github.com/darkmintis/mole/issues
topics:
  - storage
  - debugging
  - inspector
  - development

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: '>=9.2.4 <12.0.0'
  hive: ^2.2.3
  path_provider: ^2.1.4
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
